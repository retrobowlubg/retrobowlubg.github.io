<html style="height: 540px">

<head>
    <style id="styles">
        html,
        body {
            overflow-y: hidden;
        }

        body {
            background: #222;
        }

        * {
            padding: 0;
            margin: 0;
        }

        *[hidden] {
            display: none !important;
        }

        canvas {
            display: block;
            width: 332px;
            height: 562px;
            padding: 3px;
            box-sizing: border-box;
        }

        div.background {
            z-index: -1;
        }

        div.black-canvas-box {
            position: absolute;
            width: 294px;
            height: 534px;
            margin: 3px;
            box-sizing: border-box;
            background: black;
        }

        div.red-line {
            position: absolute;
            top: 91px;
            left: 3px;
            width: 294px;
            height: 1px;
            background: red;
        }

        div.rateTetry {
            
            display: flex;
/*            margin: 3px;*/
/*            margin-top: 1px;*/
            align-items: center;
/*            padding: 2px 0;*/
            user-select: none;
            position: relative;
        }

        div.rateTetry img.coffee {
            height: 35px;
margin-right: 10px;
        }

        div.rateTetry a.text {
            color: white;
            font-size: 12px;
            margin: auto 0;
            transform: translateY(-1px);
            cursor: pointer;
            text-decoration: none;
        }

        div.rateTetry a.text span.rateTetry {
            font-weight: bold;
            text-decoration: underline;
        }

        div.rateTetry a.hide {
            height: 100%;
            padding: 10px;
            cursor: pointer;
        }

        div.rateTetry a.hide img {
            height: 100%;
            padding: 4.5px;
            box-sizing: border-box;
        }


    </style>
    <title>Tetrys - Falling blocks</title>
</head>

<body>
    <div class="background black-canvas-box"></div>
    <div class="background red-line"></div> <canvas id="canvas" width="450" height="810"></canvas>
    <script src="tetrys.js"></script>

      <div class="rateTetry" > 
         
            

       
        <a class="text rate" id="rate" href="#" target="_blank">
           <img class="coffee" src="images/star.svg" alt="Rate" height="35" width="23">

        </a>   
 

 
<a class="redirCardLink" href="https://chromewebstore.google.com/detail/arcade-classics/nmmgpbdiaofjcjmomgfpaplmabdkpjpm" target="_blank" ><div class="gameCard">
            <img style="width: 32px;" class="icon" src="arcade.png" alt="Arcade"/>
        </div></a>
    </div>
    <script type="text/javascript" src="rate.js"></script>
</body>

</html>
